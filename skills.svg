<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="What I can do: Distributed Systems, Microservices, REST APIs, GraphQL, System Design, Problem Solving, Data Structures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
    <linearGradient id="hd" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <style>@font-face{font-family:'InterEmbed';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterEmbed';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
      .t{font-family:'InterEmbed',Inter,'Segoe UI',Arial,sans-serif}
      .card{animation:in .7s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes in{from{opacity:0;transform:translateY(14px)}}
      .halo{animation:halo 3s ease-in-out infinite;transform-origin:46px 46px;transform-box:view-box}
      @keyframes halo{0%,100%{fill-opacity:.1}50%{fill-opacity:.28}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <text x="30" y="46" class="t" font-size="24" font-weight="700" fill="url(#hd)" letter-spacing="-0.4">What I can do</text>
  <g transform="translate(30 70)"><g class="card" style="animation-delay:0.00s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#22d3ee" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#22d3ee"/>
  <circle cx="46" cy="46" r="26" fill="#22d3ee" fill-opacity=".12" class="halo" style="animation-delay:0.0s"/>
  <g stroke="#22d3ee" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="46" y1="34" x2="34" y2="56"/><line x1="46" y1="34" x2="58" y2="56"/><line x1="34" y1="56" x2="58" y2="56"/></g><circle cx="46" cy="34" r="5" fill="#22d3ee"/><circle cx="34" cy="56" r="5" fill="#22d3ee"/><circle cx="58" cy="56" r="5" fill="#22d3ee"/>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Distributed Systems</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Rate limiting, circuit breakers,</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">consistency across replicas</text>
</g></g><g transform="translate(320 70)"><g class="card" style="animation-delay:0.15s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#a78bfa" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#a78bfa"/>
  <circle cx="46" cy="46" r="26" fill="#a78bfa" fill-opacity=".12" class="halo" style="animation-delay:0.4s"/>
  <g stroke="#a78bfa" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="32" width="11" height="11" rx="3"/><rect x="49" y="32" width="11" height="11" rx="3"/><rect x="32" y="49" width="11" height="11" rx="3"/></g><rect x="49" y="49" width="11" height="11" rx="3" fill="#a78bfa"/>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Microservices</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Gateway routing, service registry,</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">independently deployable services</text>
</g></g><g transform="translate(610 70)"><g class="card" style="animation-delay:0.30s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#f472b6" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#f472b6"/>
  <circle cx="46" cy="46" r="26" fill="#f472b6" fill-opacity=".12" class="halo" style="animation-delay:0.8s"/>
  <g stroke="#f472b6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 40 H58 M52 34 L58 40 L52 46"/><path d="M60 54 H34 M40 48 L34 54 L40 60"/></g>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">REST APIs</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Validated, documented endpoints</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">with Express and FastAPI</text>
</g></g><g transform="translate(900 70)"><g class="card" style="animation-delay:0.45s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#facc15" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#facc15"/>
  <circle cx="46" cy="46" r="26" fill="#facc15" fill-opacity=".12" class="halo" style="animation-delay:1.2s"/>
  <g stroke="#facc15" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M46 31 L59 38.5 V53.5 L46 61 L33 53.5 V38.5 Z"/><path d="M46 31 L59 53.5 H33 Z" stroke-width="1.6"/></g>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">GraphQL</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Typed schemas, resolvers and</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">client-driven queries</text>
</g></g><g transform="translate(175 240)"><g class="card" style="animation-delay:0.60s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#4ade80" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#4ade80"/>
  <circle cx="46" cy="46" r="26" fill="#4ade80" fill-opacity=".12" class="halo" style="animation-delay:1.6s"/>
  <g stroke="#4ade80" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M46 31 L60 38 L46 45 L32 38 Z"/><path d="M32 46 L46 53 L60 46"/><path d="M32 54 L46 61 L60 54"/></g>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">System Design</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Scalable architectures, caching,</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">and clear trade-offs</text>
</g></g><g transform="translate(465 240)"><g class="card" style="animation-delay:0.75s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#60a5fa" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#60a5fa"/>
  <circle cx="46" cy="46" r="26" fill="#60a5fa" fill-opacity=".12" class="halo" style="animation-delay:2.0s"/>
  <g stroke="#60a5fa" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M40 52 C34 47 34 34 46 32 C58 34 58 47 52 52 V55 H40 Z"/><line x1="41" y1="60" x2="51" y2="60"/></g><circle cx="46" cy="43" r="3" fill="#60a5fa"/>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Problem Solving</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Breaking hard problems into</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">simple, testable pieces</text>
</g></g><g transform="translate(755 240)"><g class="card" style="animation-delay:0.90s">
  <rect width="270" height="150" rx="14" fill="#151236" stroke="#fb923c" stroke-opacity=".35"/>
  <rect x="24" y="0" width="56" height="3" rx="1.5" fill="#fb923c"/>
  <circle cx="46" cy="46" r="26" fill="#fb923c" fill-opacity=".12" class="halo" style="animation-delay:2.4s"/>
  <g stroke="#fb923c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="46" y1="35" x2="36" y2="48"/><line x1="46" y1="35" x2="56" y2="48"/><line x1="36" y1="48" x2="31" y2="59"/><line x1="36" y1="48" x2="41" y2="59"/></g><circle cx="46" cy="35" r="4.5" fill="#fb923c"/><circle cx="36" cy="48" r="4" fill="#fb923c"/><circle cx="56" cy="48" r="4" fill="#fb923c"/><circle cx="31" cy="59" r="3" fill="#fb923c"/><circle cx="41" cy="59" r="3" fill="#fb923c"/>
  <text x="24" y="100" class="t" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Data Structures</text>
  <text x="24" y="122" class="t" font-size="13.5" fill="#a5b4fc">Trees, graphs, heaps and DP,</text>
  <text x="24" y="140" class="t" font-size="13.5" fill="#a5b4fc">practiced in Python and Java</text>
</g></g>
</svg>