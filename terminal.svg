<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Terminal: whoami, focus and current work">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,monospace}
      .l{opacity:0;animation:show 12s steps(1) infinite both}
      @keyframes show{0%{opacity:0}3%{opacity:1}90%{opacity:1}95%{opacity:0}100%{opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="858" height="248" rx="14" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="44" cy="22" r="6" fill="#ffbd2e"/><circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <text x="430" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">mayur@dev: ~</text>
  <line x1="1" y1="42" x2="859" y2="42" stroke="#21262d"/>

  <g class="mono" font-size="15">
    <text x="24" y="74"  class="l" style="animation-delay:.3s"><tspan fill="#4ade80">➜</tspan><tspan fill="#22d3ee"> ~ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <text x="24" y="98"  class="l" style="animation-delay:1.2s" fill="#c4b5fd">Mayur Bagul — Software Engineer (backend · full-stack)</text>

    <text x="24" y="132" class="l" style="animation-delay:2.4s"><tspan fill="#4ade80">➜</tspan><tspan fill="#22d3ee"> ~ </tspan><tspan fill="#e6edf3">cat focus.txt</tspan></text>
    <text x="24" y="156" class="l" style="animation-delay:3.3s" fill="#f9a8d4">auth &amp; security · API gateways · money-safe backends · cloud infra</text>

    <text x="24" y="190" class="l" style="animation-delay:4.5s"><tspan fill="#4ade80">➜</tspan><tspan fill="#22d3ee"> ~ </tspan><tspan fill="#e6edf3">git commit -m "ship it" &amp;&amp; git push</tspan></text>
    <text x="24" y="214" class="l" style="animation-delay:5.4s"><tspan fill="#4ade80">✔</tspan><tspan fill="#fde047"> deployed to production</tspan><tspan fill="#8b949e">  — open to new opportunities</tspan></text>
  </g>
  <rect x="24" y="226" width="10" height="4" fill="#22d3ee" class="blink"/>
</svg>
